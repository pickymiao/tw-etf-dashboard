name: Daily ETF data update

on:
  schedule:
    # 10:30 UTC = 18:30 Asia/Taipei -- by this time TWSE closing prices AND the
    # 三大法人 institutional buy/sell report are both reliably published (running
    # right at 13:30 close was too early for the institutional data specifically).
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab always still works

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data and compute indicators
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "chore: daily ETF data update $(date -u +%Y-%m-%d)"
            git push
          fi

      # Pushes made with the default GITHUB_TOKEN (the commit above) don't trigger
      # deploy-pages.yml's `on: push` -- GitHub blocks that to avoid recursive runs.
      # So redeploy Pages directly here instead of relying on that workflow to fire.
      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

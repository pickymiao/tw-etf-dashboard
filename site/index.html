<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5f0">
<title>市場觀測</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"><div class="meta">載入中</div></main>
<script src="render.js"></script>
<script>
fetch("data/market.json", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (m) {
    document.getElementById("app").innerHTML =
      renderMeta(m) + renderMarketState(m) + renderGlobal(m) + renderHoldingsWeek(m) + renderHistory(m) +
      '<p class="note">市場狀態由固定規則自動判斷，僅供參考，不構成投資建議。<br>' +
      "價格已還原除息；美股數據為台股前一交易日收盤。</p>";
  })
  .catch(function (e) {
    document.getElementById("app").innerHTML = '<p class="err">資料載入失敗（' + e.message + "）</p>";
  });
</script>
</body>
</html>
